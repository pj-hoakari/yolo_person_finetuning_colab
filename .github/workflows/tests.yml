name: Synthetic tests and notebook consistency

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic test dependencies
        run: python -m pip install 'Pillow>=10,<13' 'PyYAML>=6,<7'
      - name: Check generated notebook matches source
        run: python tools/build_notebook.py --check
      - name: Run synthetic tests only
        run: python -m unittest discover -s tests -v
      - name: Compile Python files
        run: python -m compileall -q src tests tools
      - name: Check whitespace
        run: git diff --check
